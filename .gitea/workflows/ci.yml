name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Docs-vs-code drift. Hard checks (a documented env var nothing reads, a
      # documented script that does not exist, a broken relative link, an env
      # template variable missing from the README table) fail the run; soft
      # checks (code the docs have not caught up with yet) only warn, so a
      # feature branch adding a module or test cannot turn this red.
      - name: Docs drift
        run: npm run check:docs

      # The demo is a separate Vite build shipped to GitHub Pages. Building it
      # here catches a broken import in site/ on the primary pipeline instead of
      # discovering it after the Pages deploy fails.
      - name: Demo build
        run: npm run demo:build

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-session-secret-1234567890
          ADMIN_PASSWORD: ci-admin-password
