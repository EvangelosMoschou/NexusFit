# Dependabot configuration.
#
# Weekly, grouped dependency updates for the npm project (root) and for the
# GitHub Actions used by the workflows in this directory. Grouping keeps the PR
# queue reviewable: coupled packages (Next.js + React) arrive together, and
# low-risk minor/patch bumps are batched into one PR per ecosystem per week.
#
# Security updates are delivered separately by Dependabot and are not affected
# by `open-pull-requests-limit` or by the `groups` below.
#
# Note: Dependabot version updates must also be enabled for the repository
# (Settings → Code security and analysis → Dependabot version updates), and the
# Gitea/Forgejo mirror needs its own updater — see docs/security/supply-chain.md.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Runtime + toolchain dependencies (package.json / package-lock.json).
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
      include: scope
    # Wait a few days after a release before opening a PR. A freshly published
    # version is the most likely to be a compromised or yanked release; the
    # cooldown gives the registry and the community time to notice. Security
    # updates ignore `cooldown` and still arrive immediately.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Major bumps the toolchain cannot take yet. Each one makes `npm install`
    # fail (or resolve a tree the linter cannot use), which turns every preview
    # deployment on the branch red. Remove an entry as soon as the blocker
    # clears; minor and patch updates are unaffected.
    ignore:
      # typescript 7: typescript-eslint (pulled in by eslint-config-next) hard
      # refuses to load against the TS 7 native compiler ("typescript-eslint
      # does not support TS 7.0") and declares peerDependencies.typescript
      # ">=4.8.4 <6.1.0". We therefore run the official Microsoft side-by-side
      # setup: `typescript` is the TS 6.0 API package (what the linter and
      # Next's build-time type check load) and `@typescript/native` is the
      # alias that provides the TS 7 `tsc` used by `npm run typecheck`. Keep
      # `typescript` on 6.0.x until typescript-eslint supports TS 7.1+
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940);
      # then collapse both aliases back into a plain `typescript@^7` bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # These move as a unit: a Next.js bump frequently requires matching React
      # and @types versions, and eslint-config-next must track Next.js exactly.
      nextjs-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - eslint-config-next
      # Everything else: minor and patch bumps only, one PR per week. Major
      # updates are still opened individually so they can be reviewed properly.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # GitHub Actions used by .github/workflows/*.yml.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
    # Actions run with a repository token, so let a new release settle first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
